name: Release

on:
  workflow_dispatch:
    inputs:
      versioning:
        description: "How to decide release versions"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "prerelease"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Computes versions (Conventional Commits), bumps package.json + changelogs,
  # and opens a "Release" PR. Merging that PR tags each released package.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # PAT (contents:write + pull-requests:write) so release-please can
          # open Release PRs; the org disables GITHUB_TOKEN PR creation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # When the Release PR is merged, verify and publish only the released
  # packages, in dependency order (bases before dependents).
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build all packages
        run: npm run build:all

      - name: Run tests
        run: npm run test

      - name: Run typecheck
        run: npm run typecheck

      # Last gate before anything hits npm: abort if the documented MCP tool
      # surface (README, package.json, SKILL copies) drifted from schemas.ts.
      - name: Verify MCP doc/tool-surface drift
        run: npm run check:docs

      - name: Publish released packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PATHS: ${{ needs.release-please.outputs.paths }}
        run: |
          set -euo pipefail
          echo "$PATHS" > /tmp/released.json
          # Dependency order: bases (akg-core, plugin-api) before dependents.
          order="packages/akg-core packages/plugin-api packages/plugin-runtime packages/akg-indexer packages/mcp-server packages/cli"
          for p in $order; do
            if node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/released.json')).includes('$p') ? 0 : 1)"; then
              echo "=== publishing $p ==="
              (cd "$p" && npm publish --access public)
            fi
          done