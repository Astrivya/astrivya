name: Release

on:
  # Every merge to main runs release-please: it opens/updates the release PR,
  # or (when the release PR was just merged) creates the releases + tags so the
  # publish job ships the packages. Manual dispatch still available for
  # backfills. Runs on the same branch serialize via the concurrency group.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versioning:
        description: "How to decide release versions"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "prerelease"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Computes versions (Conventional Commits), bumps package.json + changelogs,
  # and opens a "Release" PR. Merging that PR tags each released package.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # PAT (contents:write + pull-requests:write) so release-please can
          # open Release PRs; the org disables GITHUB_TOKEN PR creation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps `version` fields but NOT the inter-package
      # @astrivya/* ranges (npm ci would fail with ERESOLVE) and re-serializes
      # package.json (breaking `npm run lint`). Patch the release branch so the
      # merged result installs and lints cleanly:
      #   1. align @astrivya ranges to the new version
      #   2. regenerate package-lock.json to match
      #   3. re-apply biome formatting
      - name: Prepare release branch (align ranges + format)
        if: steps.release.outputs.releases_created != 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release-please--branches--${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH" || exit 0  # no release PR (nothing to release)
          git checkout -B "$BRANCH" "origin/$BRANCH"
          # Always use main's script: the release branch may predate a script fix.
          git fetch origin main
          git show origin/main:scripts/align-release-ranges.mjs > scripts/align-release-ranges.mjs
          node scripts/align-release-ranges.mjs
          npm install --package-lock-only --no-audit --no-fund
          npx -y @biomejs/biome@1.9.4 format --write packages/*/package.json
          if git diff --quiet; then
            echo "release branch already prepared"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: align inter-package ranges for release"
            # Push with the PAT, not GITHUB_TOKEN: workflows triggered by
            # GITHUB_TOKEN pushes from actions are suppressed, so the release
            # PR shows "no checks reported" and branch protection blocks the
            # merge. PAT pushes run CI under a real actor.
            git push "https://x-access-token:${RELEASE_PLEASE_TOKEN}@github.com/Astrivya/astrivya.git" "$BRANCH"
          fi

      # Once the branch is prepared and its CI reports (see above), hand the
      # release PR to GitHub's native auto-merge. It waits for required checks
      # + up-to-date, then merges — the merge push to main re-triggers this
      # workflow, which then creates the releases and publishes.
      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.releases_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release-please--branches--${GITHUB_REF_NAME}"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "Enabling auto-merge on release PR #$PR"
            gh pr merge "$PR" --auto --merge || echo "not ready yet; retried on the next run"
          else
            echo "no open release PR"
          fi

  # When the Release PR is merged, verify and publish only the released
  # packages, in dependency order (bases before dependents).
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build all packages
        run: npm run build:all

      - name: Run tests
        run: npm run test

      - name: Run typecheck
        run: npm run typecheck

      # Last gate before anything hits npm: abort if the documented MCP tool
      # surface (README, package.json, SKILL copies) drifted from schemas.ts.
      - name: Verify MCP doc/tool-surface drift
        run: npm run check:docs

      - name: Publish released packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PATHS: ${{ needs.release-please.outputs.paths }}
        run: |
          set -euo pipefail
          echo "$PATHS" > /tmp/released.json
          # Dependency order: bases (akg-core, plugin-api) before dependents.
          order="packages/akg-core packages/plugin-api packages/plugin-runtime packages/akg-indexer packages/mcp-server packages/cli"
          for p in $order; do
            if node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/released.json')).includes('$p') ? 0 : 1)"; then
              echo "=== publishing $p ==="
              (cd "$p" && npm publish --access public)
            fi
          done