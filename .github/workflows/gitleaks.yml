name: Secret Scan (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: catches secrets introduced and removed within one push.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # gitleaks-action requires a GITLEAKS_LICENSE secret for
      # organization-owned repos, so run the gitleaks binary directly —
      # same full-history scan, no license, no extra permissions.
      - name: Run Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          # Baseline (.gitleaks-baseline.json, generated 2026-08-14 with the
          # full rule set) suppresses pre-existing history findings; only NEW
          # findings fail. Regenerate with:
          #   ./gitleaks detect --source . --config .gitleaks.toml --report-format json --report-path .gitleaks-baseline.json
          ./gitleaks detect --source . --redact --exit-code 1 --baseline-path .gitleaks-baseline.json
