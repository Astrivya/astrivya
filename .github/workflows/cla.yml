name: CLA

# Automates the CLA check described in CLA.md ("How to agree"): a PR is
# labeled `cla-signed` when the author (or an authorized signer) posts the
# agreement signal in the PR body or a comment; otherwise it gets
# `cla-required`. Maintainers can override manually.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SIGNAL = /I agree to the \[Astrivya CLA\]/i;

            let pr;
            if (context.payload.pull_request) {
              pr = context.payload.pull_request;
            } else {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              pr = data;
            }

            const author = pr.user.login;
            const body = pr.body || "";

            // Collect agreement signals from the PR body + all comments.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const signed =
              SIGNAL.test(body) ||
              comments.some((c) => c.user.login === author && SIGNAL.test(c.body || ""));

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const hasSigned = labels.some((l) => l.name === "cla-signed");
            const hasRequired = labels.some((l) => l.name === "cla-required");

            if (signed && !hasSigned) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["cla-signed"],
              });
            }
            if (signed && hasRequired) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: "cla-required",
              });
            }
            if (!signed && !hasRequired) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["cla-required"],
              });
            }