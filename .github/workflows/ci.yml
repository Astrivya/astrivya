name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build:all
      - run: npm run typecheck
      - run: npm run test
      # Spawns the real built CLI in isolated temp workspaces: help/config,
      # the full AKG lifecycle, git hooks, sync/team/plugins/credits flows, and
      # the interactive TUI slash-autocomplete. Blocks merges on CLI regressions.
      - name: CLI e2e
        run: npm -w packages/cli run test:e2e
        timeout-minutes: 10
      # Fails when documented MCP tool counts/tables drift from schemas.ts
      - run: npm run check:docs
      - run: npm audit --omit=dev --audit-level=high
